<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">API and automation patterns across independent projects</title>
  <desc id="d">A conceptual map showing a caller and trigger, contract and validation, governed API or webhook, durable job and recovery, and operator review.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#11141a"/><stop offset="1" stop-color="#0a0c11"/></linearGradient><linearGradient id="flow"><stop stop-color="#c6f36b"/><stop offset=".52" stop-color="#69dcff"/><stop offset="1" stop-color="#bba2ff"/></linearGradient></defs>
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/><text x="42" y="48" fill="#aeb8c8" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3">A REPEATABLE INTEGRATION REVIEW</text>
  <g font-family="Arial,sans-serif"><g><rect x="42" y="98" width="190" height="144" rx="16" fill="#171c25" stroke="#3f4958"/><circle cx="70" cy="127" r="6" fill="#c6f36b"/><text x="60" y="165" fill="#fff" font-size="18" font-weight="700">Trigger</text><text x="60" y="197" fill="#aeb8c8" font-size="14">Web · CRM · event</text></g>
  <g><rect x="274" y="98" width="190" height="144" rx="16" fill="#171c25" stroke="#3f4958"/><circle cx="302" cy="127" r="6" fill="#c6f36b"/><text x="292" y="165" fill="#fff" font-size="18" font-weight="700">Contract</text><text x="292" y="197" fill="#aeb8c8" font-size="14">Validate · map · identify</text></g>
  <g><rect x="506" y="98" width="190" height="144" rx="16" fill="#171c25" stroke="#3f4958"/><circle cx="534" cy="127" r="6" fill="#69dcff"/><text x="524" y="165" fill="#fff" font-size="18" font-weight="700">Governed call</text><text x="524" y="197" fill="#aeb8c8" font-size="14">API · OAuth · webhook</text></g>
  <g><rect x="738" y="98" width="190" height="144" rx="16" fill="#171c25" stroke="#3f4958"/><circle cx="766" cy="127" r="6" fill="#69dcff"/><text x="756" y="165" fill="#fff" font-size="18" font-weight="700">Durable work</text><text x="756" y="197" fill="#aeb8c8" font-size="14">Queue · retry · reconcile</text></g>
  <g><rect x="970" y="98" width="190" height="144" rx="16" fill="#171c25" stroke="#3f4958"/><circle cx="998" cy="127" r="6" fill="#bba2ff"/><text x="988" y="165" fill="#fff" font-size="18" font-weight="700">Operator review</text><text x="988" y="197" fill="#aeb8c8" font-size="14">Status · audit · recover</text></g></g>
  <path d="M233 170H266M465 170H498M697 170H730M929 170H962" stroke="url(#flow)" stroke-width="3" stroke-dasharray="6 7"/>
  <text x="42" y="300" fill="#818b9b" font-family="Arial,sans-serif" font-size="14">Conceptual synthesis from separate public cases and documented implementations — not a single deployed architecture.</text>
</svg>
